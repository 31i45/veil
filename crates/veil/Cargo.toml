[package]
name = "veil"
edition.workspace = true
version.workspace = true

[dependencies]
veil-core = { path = "../veil-core" }
veil-ui = { path = "../veil-ui" }
arboard = "3"
# 公式渲染（ADR-002）：纯 Rust 排版+光栅化，字体内嵌；3.x 需 Rust 1.99（已满足）
latex-rust = { version = "3.0", features = ["png"] }
# latex-rust 只出 PNG 字节，解码为 RGBA 供帧合成
png = "0.18"
# 仅 HTML 导出使用（INSTANCE §6 预算内）；编辑/渲染主链路不经过它
pulldown-cmark = "0.13"
# 外部文件监听（切片 16）：事件线程 + 非阻塞通道，策略在 veil-ui
notify = "8"
# PDF 原生导出（Wave 3A）：pdf-writer 0.15 + ttf-parser + subsetter 0.2.6
# spike 实测合计 +730 KB（零 PDF 时 6.18 MB → 引入后约 6.9 MB），门禁放宽到 7 MiB 仅因 PDF 导出门槛
pdf-writer = "0.15"
ttf-parser = "0.25"
subsetter = "0.2.6"
