<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>veil</title>
<style>
body{max-width:44em;margin:2em auto;padding:0 1em;font:16px/1.6 system-ui,sans-serif;background:#ffffff;color:#1e1e1e;overflow-wrap:anywhere;word-break:break-word}
a{color:#2b6cb0}
code,pre{background:#f5f5f5;border:1px solid #dddddd;font-family:Consolas,Menlo,monospace}
code{padding:.1em .3em}
pre{padding:.8em;overflow-x:auto}
pre code{padding:0;border:none}
kbd{border:1px solid #dddddd;border-radius:3px;padding:.05em .35em;font-size:.9em;font-weight:600;background:#f5f5f5;box-shadow:0 1px 0 #dddddd}
sub,sup{font-size:.75em;line-height:0}
sub{vertical-align:-0.25em}
sup{vertical-align:0.5em}
mark{background:#fff799;color:inherit;padding:0 .1em;border-radius:2px}
abbr[title]{text-decoration:underline dotted;cursor:help}
details{margin:.8em 0;padding:.2em .6em;border-left:3px solid #dddddd}
summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:.4em}
img{max-width:100%;height:auto}
figure{margin:1em 0;text-align:left}
figure.img-center{text-align:center}
figure.img-right{text-align:right}
figcaption{margin-top:.4em;color:#666666;font-size:.9em;overflow-wrap:anywhere;word-break:break-word}
td img,th img{max-height:2.4em}
blockquote{border-left:4px solid #dddddd;margin-left:0;padding-left:1em;color:#666666}
table{border-collapse:collapse}
th,td{border:1px solid #dddddd;padding:.4em .6em}
hr{border:none;border-top:1px solid #dddddd}
div.math{text-align:center;margin:1em 0}
span.math-inline{display:inline-block;vertical-align:middle;line-height:0;max-width:100%}
span.math-inline svg{display:block;max-width:100%;height:auto}
pre.math-source{color:#a00;background:#fdf5f5}
.fnref a{text-decoration:none}
.footnotes{border-top:1px solid #dddddd;margin-top:2em;padding-top:.5em;color:#666666;font-size:.9em}
</style>
</head>
<body>
<p><a>javascript:alert(1)</a></p>
</body>
</html>
