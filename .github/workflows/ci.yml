name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # 与 release.yml 同理：缓存恢复的指纹可能比 checkout 源码更新，导致复用
      # 旧测试二进制而出现假绿/假红。只清工作区 crate，保留依赖缓存。
      - name: 清理工作区产物
        run: cargo clean -p veil -p veil-ui -p veil-core -p veil-mermaid-offline

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: 全量测试
        run: cargo test --workspace

      - name: Clippy（零警告）
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      # 一致性基线只升不降：任一指标低于 conformance.rs 顶部常量即失败。
      # 单独跑一次以打印各套数字，便于在 CI 日志中定位退化来源。
      - name: CommonMark 一致性门禁
        run: cargo test -p veil-core --test conformance -- --nocapture

      - name: GFM 扩展一致性门禁
        run: cargo test -p veil-core --test gfm_conformance -- --nocapture
