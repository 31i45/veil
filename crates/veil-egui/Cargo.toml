[package]
name = "veil-egui"
edition.workspace = true
version.workspace = true

[dependencies]
veil-core = { path = "../veil-core" }
# 切片 1：winit 直收 IME（spike 验证路径）+ softbuffer 软件呈现 + cosmic-text 排版。
# chrome 自绘 + Win32 FFI 对话框已定案（ADR-005），不引入 egui/GL。
winit = "0.30"
softbuffer = "0.4"
cosmic-text = "0.19"

[dev-dependencies]
# 性质级测试（ADR-009 S6 阶段 B）：验证 Memo 因果键对任意编辑序列的正确性。
# 只进测试二进制，release build 零膨胀；传递依赖 +~30，仍在 200 红线内。
proptest = "1"
