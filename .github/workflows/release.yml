name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, test, gate, smoke and validate artifacts without publishing'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Check veil-core
        run: cargo check -p veil-core

      - name: Test veil-core
        run: cargo test -p veil-core

  release:
    needs: core-linux
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本身份的唯一判定点：tag 名必须等于 Cargo.toml workspace version。
      # 否则 veil.exe 的 VERSIONINFO、SBOM 文件名、安装包版本会互相漂移
      # （v3.0.1 首轮发布即因此产出 ProductVersion=3.0.0 的 exe）。
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($cargoVersion)) { throw 'could not read workspace version from Cargo.toml' }
          if ('${{ github.ref }}' -like 'refs/tags/v*') {
            $tagVersion = '${{ github.ref_name }}'.Substring(1)
            if ($tagVersion -ne $cargoVersion) {
              Write-Host "FAIL: tag v$tagVersion does not match Cargo.toml workspace version $cargoVersion; bump the version before tagging"
              exit 1
            }
          }
          "value=$cargoVersion" >> $env:GITHUB_OUTPUT
          Write-Host "release version: $cargoVersion"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      # rust-cache 会恢复上次的 target/。若恢复出的指纹时间戳比本次 checkout 的
      # 源码更新，cargo 可能复用旧测试二进制（曾出现指向旧源码行号的 panic）。
      # 发布物必须由当前源码重建：只清工作区 crate，保留第三方依赖缓存。
      # 单产物发布只用一个默认 target 目录，不再有 target-default / target-full。
      - name: Clean workspace artifacts
        run: cargo clean -p veil -p veil-ui -p veil-core -p veil-mermaid-offline

      # 默认 feature 即包含 mermaid-offline：唯一的 veil.exe。
      - name: Build veil.exe
        run: cargo build --release --bin veil

      # 远程 SVG mock 使用 20 ms 墙钟截止，并行执行在忙 runner 上会假超时
      # （CHANGELOG「测试稳定性」）；发布门禁必须按文档口径串行。
      - name: cargo test
        run: |
          cargo test --workspace --release -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: cargo clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 第三方许可清单新鲜度
        shell: pwsh
        run: pwsh -NoProfile -File tools/third_party_notices.ps1 -Check

      # 与 tools/release.ps1 的审计口径一致：直接安装后执行 cargo deny check。
      - name: 依赖审计（cargo-deny）
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      # 门禁必须放在测试之后：cargo test 会重建 bin，先门禁后测试可能放过
      # 被测试构建覆盖过的产物。这里校验的正是最终要上传的二进制。
      # 单一产物：≤14 MiB，且必须携带离线引擎特征串（默认 feature）。
      - name: Gate veil.exe boundary
        shell: pwsh
        run: |
          $exe = "target\release\veil.exe"
          $size = (Get-Item $exe).Length
          $sizeMB = [math]::Round($size / 1MB, 2)
          Write-Host "veil.exe size: $sizeMB MiB ($size bytes; budget: 14.0 MiB)"
          if ($size -gt 14.0MB) {
            Write-Host "FAIL: veil.exe exceeds 14.0 MiB budget"
            exit 1
          }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($n in @('QuickJS','linkedom','mermaid')) {
            if (-not $text.Contains($n)) {
              Write-Host "FAIL: veil.exe missing offline engine string '$n'"
              exit 1
            }
          }
          Write-Host "PASS: veil.exe boundary correct (offline engine strings present, size OK)"

      # 零级门禁：真实启动冒烟。交互桌面断言标题、出窗与 1 秒预算；Session 0 /
      # 非交互桌面只断言存活、无 panic、WM_CLOSE 正常退出且退出码为 0，并以
      # stage=pass-degraded 记录断言子集。两种结果都不使用 continue-on-error。
      - name: Smoke launch veil.exe (tier-0 gate)
        shell: pwsh
        run: pwsh -NoProfile -File tools/smoke_launch.ps1 -ExePath target/release/veil.exe -ExpectedTitlePattern '^veil' -MaxLaunchMs 1000

      - name: Report artifact size
        run: |
          $exe = Get-Item target\release\veil.exe
          Write-Host "$($exe.Name): $([math]::Round($exe.Length/1MB, 2)) MiB ($($exe.Length) bytes)"
          $vi = $exe.VersionInfo
          Write-Host "  Version: $($vi.ProductVersion) / FileVersion: $($vi.FileVersion)"

      # 可选生产签名：证书以 Base64 PFX 和密码分别存放在 secrets。
      # 不配置证书时明确记录 UNSIGNED，但仍继续生成同一 exe 的 SHA 侧车。
      - name: Sign veil.exe (optional Authenticode + RFC3161)
        shell: pwsh
        env:
          VEIL_SIGNING_CERTIFICATE_BASE64: ${{ secrets.VEIL_SIGNING_CERTIFICATE_BASE64 }}
          VEIL_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.VEIL_SIGNING_CERTIFICATE_PASSWORD }}
          VEIL_SIGNING_TIMESTAMP_URL: ${{ vars.VEIL_SIGNING_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:VEIL_SIGNING_CERTIFICATE_BASE64)) {
            Write-Host 'UNSIGNED: no production signing certificate configured; continuing without Authenticode.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:VEIL_SIGNING_CERTIFICATE_PASSWORD)) {
            throw 'VEIL_SIGNING_CERTIFICATE_PASSWORD is required when a certificate is configured.'
          }
          $timestamp = $env:VEIL_SIGNING_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestamp)) { $timestamp = 'http://timestamp.digicert.com' }
          $exe = (Resolve-Path 'target\release\veil.exe').Path
          $signTool = Get-Command signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $signToolExe = if ($signTool) { $signTool.Source } else { $null }
          if (-not $signToolExe) {
            $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $candidate = Get-ChildItem -LiteralPath $sdkBin -Filter signtool.exe -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($candidate) { $signToolExe = $candidate.FullName }
          }
          if (-not $signToolExe) { throw 'Authenticode signing requested, but signtool.exe was not found.' }

          $certificate = Join-Path $env:RUNNER_TEMP 'veil-signing.pfx'
          [System.IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:VEIL_SIGNING_CERTIFICATE_BASE64))
          try {
            & $signToolExe sign /fd SHA256 /f $certificate /p $env:VEIL_SIGNING_CERTIFICATE_PASSWORD /tr $timestamp /td SHA256 /v $exe | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit $LASTEXITCODE" }
            $verifyOutput = @(& $signToolExe verify /pa /all /v $exe 2>&1)
            $verifyExit = $LASTEXITCODE
            $verifyOutput | Out-Host
            if ($verifyExit -ne 0) { throw "Authenticode verification failed with exit $verifyExit" }
            $verifyText = $verifyOutput -join "`n"
            if ($verifyText -notmatch 'The signature is timestamped:' -or $verifyText -notmatch 'Timestamp Verified by:') {
              throw 'RFC3161 timestamp evidence is missing or was not verified by signtool.'
            }
            Write-Host 'PASS: Authenticode signature and RFC3161 timestamp verified.'
          } finally {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
          }

      # SBOM 描述与发布字节相同的 Cargo.lock 依赖集合；必须在签名之后、SHA 之前生成。
      # 该文件只作构建证据，不进 Release 资产。
      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: pwsh -NoProfile -File tools/sbom.ps1 -OutFile "target\release\veil-v${{ steps.version.outputs.value }}.cdx.json"

      - name: Generate SHA-256 checksum
        run: |
          $exe = Get-Item target\release\veil.exe
          $hash = Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256
          $checksum = "$($hash.Hash.ToLowerInvariant())  $($exe.Name)"
          Set-Content -LiteralPath "$($exe.FullName).sha256" -Value $checksum -Encoding ascii
          Write-Host "$($exe.Name).sha256: $checksum"

      - name: Validate release artifacts
        shell: pwsh
        run: |
          $exe = Get-Item target\release\veil.exe
          $checksumPath = "$($exe.FullName).sha256"
          $line = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          $expected = ($line -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
            Write-Host "FAIL: SHA-256 mismatch for $($exe.Name)"
            exit 1
          }
          Write-Host "PASS: release artifacts validated ($($exe.Name), $($exe.Name).sha256, SHA-256 match)"

      # installer.ps1 只接受"已验证 bundle"（veil.exe + sidecar + status=passed 记录），
      # 因此这里复刻本地 release.ps1 的归档契约，而不让安装包直接吃 target/。
      # 该步骤位于签名与校验之后，打进安装包的就是最终要上传的那份 exe。
      - name: Assemble verified release bundle
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $bundle = Join-Path 'release-bundle' "veil-v$version"
          if (Test-Path -LiteralPath $bundle) { Remove-Item -LiteralPath $bundle -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item -LiteralPath 'target\release\veil.exe' -Destination $bundle -Force
          Copy-Item -LiteralPath 'target\release\veil.exe.sha256' -Destination $bundle -Force
          $exe = Get-Item -LiteralPath 'target\release\veil.exe'
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $record = [ordered]@{
            schema_version = 1
            version = $version
            artifact = 'target/release/veil.exe'
            bytes = $exe.Length
            sha256 = $hash
            timestamp = [DateTimeOffset]::UtcNow.ToString('o')
            status = 'passed'
            release_ready = $true
            source = 'github-actions/.github/workflows/release.yml'
            run_id = '${{ github.run_id }}'
          }
          $json = ($record | ConvertTo-Json -Depth 4) -replace "`r`n", "`n"
          [System.IO.File]::WriteAllText((Join-Path $bundle 'release-record.json'), $json + "`n", [System.Text.UTF8Encoding]::new($false))
          Write-Host "bundle ready: $bundle (veil.exe $hash)"

      # 可选 per-user 安装包（Inno Setup 6）。未配置生产证书时 installer.ps1
      # 自动构建 unsigned setup 并给出 NOT RUN 提示，与 exe 的签名策略一致。
      - name: Build per-user installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with exit $LASTEXITCODE" }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC not found at $iscc" }
          $version = '${{ steps.version.outputs.value }}'
          pwsh -NoProfile -File tools/installer.ps1 -Version $version -BundleRoot release-bundle -OutputDirectory release-bundle -ISCCPath $iscc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate installer artifacts
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $setup = Get-Item -LiteralPath "release-bundle\veil-setup-$version.exe"
          $sidecar = "release-bundle\veil-setup-$version.exe.sha256"
          $expected = ((Get-Content -LiteralPath $sidecar -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
            Write-Host "FAIL: installer SHA-256 mismatch ($expected != $actual)"
            exit 1
          }
          $productVersion = ([string]$setup.VersionInfo.ProductVersion).Trim()
          if ($productVersion -cne $version) {
            Write-Host "FAIL: setup ProductVersion '$productVersion' != '$version'"
            exit 1
          }
          Write-Host "PASS: $($setup.Name) $([math]::Round($setup.Length / 1MB, 2)) MiB, ProductVersion $productVersion, SHA-256 match"

      - name: Extract release notes from CHANGELOG
        run: |
          $tag = "${{ github.ref_name }}"
          $out = @()
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^##\s+') {
              if ($line -match ('^##\s+' + [regex]::Escape($tag) + '(\s|$)')) { $inside = $true; $out += $line; continue }
              elseif ($inside) { break }
            }
            if ($inside) { $out += $line }
          }
          if ($out.Count -eq 0) { $out = @('See CHANGELOG.md for details.') }
          $out -join "`n" | Set-Content -Path release-notes.md -Encoding utf8
          Write-Host "release-notes.md written: $($out.Count) lines"

      # workflow_dispatch 默认 dry_run=true；即使手动设为 false，也只有 v* tag push 能发布。
      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          name: Veil ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            target/release/veil.exe
            target/release/veil.exe.sha256
            release-bundle/veil-setup-*.exe
            release-bundle/veil-setup-*.exe.sha256

      # 重发同一 tag 时，历史运行上传过、本次不再产出的资产会残留（例如旧 SBOM）。
      # 按白名单清理，保证 Release 资产恰好是本次的四件产物。
      - name: Prune stale release assets
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $allowed = @('veil.exe', 'veil.exe.sha256', "veil-setup-$version.exe", "veil-setup-$version.exe.sha256")
          $assets = gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq '.assets[] | [.id, .name] | @tsv'
          foreach ($line in $assets) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $id, $name = $line -split "`t", 2
            if ($allowed -contains $name) { continue }
            Write-Host "deleting stale asset: $name (id=$id)"
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
          }
