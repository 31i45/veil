# cargo-deny v2 configuration for Veil.
#
# Scope: the dependency set locked in Cargo.lock (single Windows artifact).
# The license allow-list is intentionally narrow and derived from the actual
# locked packages. Do not add a license here just to make a new dependency
# pass: review the dependency instead.

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Workspace crates are publish = false; they carry no license field and are
# covered by the repository-root LICENSE, so cargo-deny skips them here.
private = { ignore = true }
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  # Present in the locked graph as the only option:
  #   clipboard-win, error-code -> BSL-1.0
  #   notify                     -> CC0-1.0
  "BSL-1.0",
  "CC0-1.0",
]
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
