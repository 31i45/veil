name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, test, gate, smoke and validate artifacts without publishing'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Check veil-core
        run: cargo check -p veil-core

      - name: Test veil-core
        run: cargo test -p veil-core

  release:
    needs: core-linux
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      # rust-cache 会恢复上次的 target/。若恢复出的指纹时间戳比本次 checkout 的
      # 源码更新，cargo 可能复用旧测试二进制（曾出现指向旧源码行号的 panic）。
      # 发布物必须由当前源码重建：只清工作区 crate，保留第三方依赖缓存。
      # 单产物发布只用一个默认 target 目录，不再有 target-default / target-full。
      - name: Clean workspace artifacts
        run: cargo clean -p veil -p veil-ui -p veil-core -p veil-mermaid-offline

      # 默认 feature 即包含 mermaid-offline：唯一的 veil.exe。
      - name: Build veil.exe
        run: cargo build --release --bin veil

      # 远程 SVG mock 使用 20 ms 墙钟截止，并行执行在忙 runner 上会假超时
      # （CHANGELOG「测试稳定性」）；发布门禁必须按文档口径串行。
      - name: cargo test
        run: |
          cargo test --workspace --release -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: cargo clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 门禁必须放在测试之后：cargo test 会重建 bin，先门禁后测试可能放过
      # 被测试构建覆盖过的产物。这里校验的正是最终要上传的二进制。
      # 单一产物：≤14 MiB，且必须携带离线引擎特征串（默认 feature）。
      - name: Gate veil.exe boundary
        shell: pwsh
        run: |
          $exe = "target\release\veil.exe"
          $size = (Get-Item $exe).Length
          $sizeMB = [math]::Round($size / 1MB, 2)
          Write-Host "veil.exe size: $sizeMB MiB ($size bytes; budget: 14.0 MiB)"
          if ($size -gt 14.0MB) {
            Write-Host "FAIL: veil.exe exceeds 14.0 MiB budget"
            exit 1
          }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($n in @('QuickJS','linkedom')) {
            if (-not $text.Contains($n)) {
              Write-Host "FAIL: veil.exe missing offline engine string '$n'"
              exit 1
            }
          }
          Write-Host "PASS: veil.exe boundary correct (offline engine strings present, size OK)"

      # 零级门禁：真实启动冒烟。交互桌面断言标题、出窗与 1 秒预算；Session 0 /
      # 非交互桌面只断言存活、无 panic、WM_CLOSE 正常退出且退出码为 0，并以
      # stage=pass-degraded 记录断言子集。两种结果都不使用 continue-on-error。
      - name: Smoke launch veil.exe (tier-0 gate)
        shell: pwsh
        run: pwsh -NoProfile -File tools/smoke_launch.ps1 -ExePath target/release/veil.exe -ExpectedTitlePattern '^veil' -MaxLaunchMs 1000

      - name: Report artifact size
        run: |
          $exe = Get-Item target\release\veil.exe
          Write-Host "$($exe.Name): $([math]::Round($exe.Length/1MB, 2)) MiB ($($exe.Length) bytes)"
          $vi = $exe.VersionInfo
          Write-Host "  Version: $($vi.ProductVersion) / FileVersion: $($vi.FileVersion)"

      - name: Generate SHA-256 checksum
        run: |
          $exe = Get-Item target\release\veil.exe
          $hash = Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256
          $checksum = "$($hash.Hash.ToLowerInvariant())  $($exe.Name)"
          Set-Content -LiteralPath "$($exe.FullName).sha256" -Value $checksum -Encoding ascii
          Write-Host "$($exe.Name).sha256: $checksum"

      - name: Validate release artifacts
        shell: pwsh
        run: |
          $exe = Get-Item target\release\veil.exe
          $checksumPath = "$($exe.FullName).sha256"
          $line = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          $expected = ($line -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
            Write-Host "FAIL: SHA-256 mismatch for $($exe.Name)"
            exit 1
          }
          Write-Host "PASS: release artifacts validated ($($exe.Name), $($exe.Name).sha256, SHA-256 match)"

      - name: Extract release notes from CHANGELOG
        run: |
          $tag = "${{ github.ref_name }}"
          $out = @()
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^##\s+') {
              if ($line -match ('^##\s+' + [regex]::Escape($tag) + '(\s|$)')) { $inside = $true; $out += $line; continue }
              elseif ($inside) { break }
            }
            if ($inside) { $out += $line }
          }
          if ($out.Count -eq 0) { $out = @('See CHANGELOG.md for details.') }
          $out -join "`n" | Set-Content -Path release-notes.md -Encoding utf8
          Write-Host "release-notes.md written: $($out.Count) lines"

      # workflow_dispatch 默认 dry_run=true；即使手动设为 false，也只有 v* tag push 能发布。
      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          name: Veil ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            target/release/veil.exe
            target/release/veil.exe.sha256
