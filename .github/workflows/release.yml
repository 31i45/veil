name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p veil

      - name: Report artifact size
        run: |
          $exe = Get-Item target\release\veil.exe
          Write-Host "Veil Release: $([math]::Round($exe.Length/1MB, 2)) MiB ($($exe.Length) bytes)"
          $vi = $exe.VersionInfo
          Write-Host "Version: $($vi.ProductVersion) / FileVersion: $($vi.FileVersion)"

      - name: Extract release notes from CHANGELOG
        run: |
          $tag = "${{ github.ref_name }}"
          $out = @()
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^##\s+') {
              if ($line -match ('^##\s+' + [regex]::Escape($tag) + '(\s|$)')) { $inside = $true; $out += $line; continue }
              elseif ($inside) { break }
            }
            if ($inside) { $out += $line }
          }
          if ($out.Count -eq 0) { $out = @('See CHANGELOG.md for details.') }
          $out -join "`n" | Set-Content -Path release-notes.md -Encoding utf8
          Write-Host "release-notes.md written: $($out.Count) lines"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Veil ${{ github.ref_name }}
          body_path: release-notes.md
          files: target/release/veil.exe
