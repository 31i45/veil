<svg height="94" viewBox="0 0 1026 94" aria-roledescription="packet" role="graphics-document document" style="max-width: 1026px;" xmlns="http://www.w3.org/2000/svg" width="1026" id="veil-mm-18"><style>#veil-mm-18{font-family:sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#veil-mm-18 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#veil-mm-18 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#veil-mm-18 .error-icon{fill:#552222;}#veil-mm-18 .error-text{fill:#552222;stroke:#552222;}#veil-mm-18 .edge-thickness-normal{stroke-width:1px;}#veil-mm-18 .edge-thickness-thick{stroke-width:3.5px;}#veil-mm-18 .edge-pattern-solid{stroke-dasharray:0;}#veil-mm-18 .edge-thickness-invisible{stroke-width:0;fill:none;}#veil-mm-18 .edge-pattern-dashed{stroke-dasharray:3;}#veil-mm-18 .edge-pattern-dotted{stroke-dasharray:2;}#veil-mm-18 .marker{fill:#333333;stroke:#333333;}#veil-mm-18 .marker.cross{stroke:#333333;}#veil-mm-18 svg{font-family:sans-serif;font-size:16px;}#veil-mm-18 p{margin:0;}#veil-mm-18 .packetByte{font-size:10px;}#veil-mm-18 .packetByte.start{fill:black;}#veil-mm-18 .packetByte.end{fill:black;}#veil-mm-18 .packetLabel{fill:black;font-size:12px;}#veil-mm-18 .packetTitle{fill:black;font-size:14px;}#veil-mm-18 .packetBlock{stroke:black;stroke-width:1;fill:#efefef;}#veil-mm-18[aria-roledescription="mindmap"] .section-root&gt;.label text{text-anchor:middle!important;}#veil-mm-18 .sections .cluster-label text,#veil-mm-18 .sections .cluster-label tspan{fill:#333333!important;}#veil-mm-18 .section-0 text,#veil-mm-18 .section-1 text,#veil-mm-18 .section-2 text,#veil-mm-18 .section-3 text,#veil-mm-18 .section-4 text,#veil-mm-18 .section-5 text,#veil-mm-18 .section-6 text,#veil-mm-18 .section-7 text,#veil-mm-18 .section-8 text,#veil-mm-18 .section-9 text,#veil-mm-18 .section-10 text,#veil-mm-18 .section-11 text{fill:#333333!important;}#veil-mm-18 text.task,#veil-mm-18 text.task tspan,#veil-mm-18 text.journey-section,#veil-mm-18 text.journey-section tspan{fill:#333333!important;}#veil-mm-18 :root{--mermaid-font-family:sans-serif;}</style><g /><g><rect class="packetBlock" height="32" width="507" y="15" x="1" /><text text-anchor="middle" dominant-baseline="middle" class="packetLabel" y="31" x="254.5">Source Port</text><text text-anchor="start" dominant-baseline="auto" class="packetByte start" y="13" x="1">0</text><text text-anchor="end" dominant-baseline="auto" class="packetByte end" y="13" x="508">15</text><rect class="packetBlock" height="32" width="507" y="15" x="513" /><text text-anchor="middle" dominant-baseline="middle" class="packetLabel" y="31" x="766.5">Destination Port</text><text text-anchor="start" dominant-baseline="auto" class="packetByte start" y="13" x="513">16</text><text text-anchor="end" dominant-baseline="auto" class="packetByte end" y="13" x="1020">31</text></g><text class="packetTitle" text-anchor="middle" dominant-baseline="middle" y="70.5" x="513">TCP</text></svg>