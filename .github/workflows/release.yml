name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      # rust-cache 会恢复上次的 target-default/target-full。若恢复出的指纹时间戳
      # 比本次 checkout 的源码更新，cargo 可能复用旧测试二进制（本次 CI 已出现
      # 指向旧源码行号的 panic）。发布物必须由当前源码重建：只清工作区 crate，
      # 保留第三方依赖缓存。
      - name: Clean workspace artifacts (veil.exe target)
        env:
          CARGO_TARGET_DIR: target-default
        run: cargo clean -p veil -p veil-ui -p veil-core -p veil-mermaid-offline

      - name: Clean workspace artifacts (veil-full.exe target)
        env:
          CARGO_TARGET_DIR: target-full
        run: cargo clean -p veil -p veil-ui -p veil-core -p veil-mermaid-offline

      - name: Build veil.exe
        env:
          CARGO_TARGET_DIR: target-default
        run: cargo build --release --bin veil

      - name: Build veil-full.exe
        env:
          CARGO_TARGET_DIR: target-full
        run: cargo build --release --bin veil-full --features mermaid-offline

      # 远程 SVG mock 使用 20 ms 墙钟截止，并行执行在忙 runner 上会假超时
      # （CHANGELOG「测试稳定性」）；发布门禁必须按文档口径串行。
      - name: cargo test default features
        env:
          CARGO_TARGET_DIR: target-default
        run: |
          cargo test --workspace --release -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: cargo test mermaid-offline
        env:
          CARGO_TARGET_DIR: target-full
        run: |
          cargo test --workspace --release --features mermaid-offline -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: cargo clippy
        env:
          CARGO_TARGET_DIR: target-full
        run: |
          cargo clippy --workspace --all-features --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 门禁必须放在测试之后：cargo test 会重建 bin，先门禁后测试可能放过
      # 被测试构建覆盖过的产物。这里校验的正是最终要上传的二进制。
      - name: Gate veil.exe boundary
        shell: pwsh
        run: |
          $exe = "target-default\release\veil.exe"
          $sizeMB = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "veil.exe size: $sizeMB MiB (target: 9.x, budget: 10.0)"
          if ((Get-Item $exe).Length -gt 10.0MB) {
            Write-Host "FAIL: veil.exe exceeds 10.0 MiB budget"
            exit 1
          }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          $needles = @('QuickJS','rquickjs','linkedom','cytoscape','fcose','veil-mermaid-offline')
          foreach ($n in $needles) {
            if ($text.Contains($n)) {
              Write-Host "FAIL: veil.exe contains '$n' (must NOT contain offline engine strings)"
              exit 1
            }
          }
          Write-Host "PASS: veil.exe boundary clean (no offline engine strings, size OK)"

      - name: Gate veil-full.exe boundary
        shell: pwsh
        run: |
          $exe = "target-full\release\veil-full.exe"
          $sizeMB = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "veil-full.exe size: $sizeMB MiB (target: 13.x, budget: 14.0)"
          if ((Get-Item $exe).Length -gt 14.0MB) {
            Write-Host "FAIL: veil-full.exe exceeds 14.0 MiB budget"
            exit 1
          }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($n in @('QuickJS','rquickjs','linkedom','cytoscape','fcose')) {
            if (-not $text.Contains($n)) {
              Write-Host "FAIL: veil-full.exe missing '$n'"
              exit 1
            }
          }
          Write-Host "PASS: veil-full.exe boundary correct (offline engine strings present, size OK)"

      # 零级门禁：真实启动冒烟。测试全绿不代表用户双击的 exe 能打开。
      # 1 秒出窗是硬预算（-MaxLaunchMs 1000）：本地 1000ms 是权威口径，CI 也
      # 必须显式传入、不得放宽。GitHub 托管 runner 是 Session 0 非交互桌面，
      # 极少数情况下冷启动更慢；即便如此也只能在 release notes 记录环境性失败，
      # 不得用 continue-on-error 掩盖。
      - name: Smoke launch veil.exe (tier-0 gate)
        shell: pwsh
        run: pwsh -NoProfile -File tools/smoke_launch.ps1 -ExePath target-default/release/veil.exe -ExpectedTitlePattern '^veil' -MaxLaunchMs 1000

      - name: Smoke launch veil-full.exe (tier-0 gate)
        shell: pwsh
        run: pwsh -NoProfile -File tools/smoke_launch.ps1 -ExePath target-full/release/veil-full.exe -ExpectedTitlePattern '^veil' -MaxLaunchMs 1000

      - name: Report artifact sizes
        run: |
          foreach ($path in @('target-default\release\veil.exe', 'target-full\release\veil-full.exe')) {
            $exe = Get-Item $path
            Write-Host "$($exe.Name): $([math]::Round($exe.Length/1MB, 2)) MiB ($($exe.Length) bytes)"
            $vi = $exe.VersionInfo
            Write-Host "  Version: $($vi.ProductVersion) / FileVersion: $($vi.FileVersion)"
          }

      - name: Generate SHA-256 checksums
        run: |
          foreach ($path in @('target-default\release\veil.exe', 'target-full\release\veil-full.exe')) {
            $exe = Get-Item $path
            $hash = Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256
            $checksum = "$($hash.Hash.ToLowerInvariant())  $($exe.Name)"
            Set-Content -LiteralPath "$($exe.FullName).sha256" -Value $checksum -Encoding ascii
            Write-Host "$($exe.Name).sha256: $checksum"
          }

      - name: Extract release notes from CHANGELOG
        run: |
          $tag = "${{ github.ref_name }}"
          $out = @()
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^##\s+') {
              if ($line -match ('^##\s+' + [regex]::Escape($tag) + '(\s|$)')) { $inside = $true; $out += $line; continue }
              elseif ($inside) { break }
            }
            if ($inside) { $out += $line }
          }
          if ($out.Count -eq 0) { $out = @('See CHANGELOG.md for details.') }
          $out -join "`n" | Set-Content -Path release-notes.md -Encoding utf8
          Write-Host "release-notes.md written: $($out.Count) lines"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Veil ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            target-default/release/veil.exe
            target-default/release/veil.exe.sha256
            target-full/release/veil-full.exe
            target-full/release/veil-full.exe.sha256
